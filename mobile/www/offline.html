<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AttendX is offline</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f3ff; color: #1d1b3a; text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #12112a; color: #ecebff; } p { color: #b9b6e3 !important; } }
  .mark { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #6C63FF, #9d97ff); display: grid; place-items: center;
    box-shadow: 0 16px 32px -12px rgba(108, 99, 255, .7); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 auto 24px; max-width: 30ch; color: #5a5880; }
  button { font: inherit; font-weight: 600; color: #fff; background: #6C63FF; border: 0;
    border-radius: 14px; padding: 14px 28px; min-height: 48px; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>AttendX needs the internet to open. Check your data or Wi-Fi, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  </script>
</body>
</html>
