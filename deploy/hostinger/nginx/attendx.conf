# AttendX — nginx in front of the app and its data services.
# __DOMAIN__ is replaced by ../install-nginx.sh; certbot adds the HTTPS (443)
# block on first certificate issue.
#
# How this differs from fAImily's config, and why:
#  - /rest/v1/ IS public. AttendX pages query the database from the browser
#    (about 20 pages use the browser client). That is safe only because every
#    table has row-level security forced on and CI proves it (tests/db/).
#  - /storage/v1/object/sign/ is public (GET only): attendance selfies are in a
#    PRIVATE bucket and are viewed through short-lived signed URLs.
#  - The sign-in rate limit exempts this server's own address: browsers sign in
#    through /api/auth/login, so every password sign-in reaches auth from here.
#    /api/auth/login applies its own per-IP + per-email limit.

limit_req_zone $binary_remote_addr zone=attendx_recover:10m rate=3r/m;
geo $attendx_from_self {
    default         0;
    127.0.0.1       1;
    187.127.159.192 1;
}
map "$attendx_from_self:$arg_grant_type" $attendx_password_key {
    "0:password" $binary_remote_addr;
    default      "";
}
limit_req_zone $attendx_password_key zone=attendx_signin:10m rate=5r/m;

# ── Public ────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Selfies are capped at 5 MB by the app; leave headroom for base64.
    client_max_body_size 12m;

    # Next.js build output: content-hashed names, safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/attendx-security.conf;
        access_log off;
    }

    # ── Auth (GoTrue). Admin API is never public; the app uses the internal
    #    gateway below for it.
    location /auth/v1/admin { return 403; }
    location = /auth/v1/recover {
        limit_req zone=attendx_recover burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/attendx-security.conf;
        proxy_pass http://127.0.0.1:9997/recover$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/v1/token {
        limit_req zone=attendx_signin burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/attendx-security.conf;
        proxy_pass http://127.0.0.1:9997/token$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9997/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        include /etc/nginx/snippets/attendx-security.conf;
    }

    # ── Database API (PostgREST). Public by design, protected by forced RLS.
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3004/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/attendx-security.conf;
    }

    # ── Storage: read-only, public objects and signed URLs only. Uploads go
    #    through the app's own API, which uses the internal gateway.
    location /storage/v1/object/public/ {
        proxy_pass http://127.0.0.1:5004/object/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/attendx-security.conf;
    }
    location /storage/v1/object/sign/ {
        proxy_pass http://127.0.0.1:5004/object/sign/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/attendx-security.conf;
    }
    location /storage/v1/ { return 403; }

    # ── Everything else: the Next.js app (pages + /api).
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s; # Copilot / AI calls can take a while
    }
}

# ── Internal: the app server's view of "Supabase" ─────────────────────────
# Only reachable from this machine. SUPABASE_INTERNAL_URL points here, and the
# app's service-role clients (admin user management, storage uploads) use it.
server {
    listen 127.0.0.1:8010;
    server_name _;
    client_max_body_size 12m;

    location /auth/v1/    { proxy_pass http://127.0.0.1:9997/; proxy_set_header Host $host; }
    location /rest/v1/    { proxy_pass http://127.0.0.1:3004/; proxy_set_header Host $host; }
    location /storage/v1/ { proxy_pass http://127.0.0.1:5004/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Prefix /storage/v1; }
}
