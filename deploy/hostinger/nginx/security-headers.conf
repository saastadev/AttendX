# AttendX — headers for responses nginx answers itself (static files, auth,
# database and storage APIs). The app's own pages set theirs in next.config.js.
# nginx drops server-level add_header lines inside a location that has its
# own, so each such location includes this file.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
