# ============================================================
# AttendX v2 — Render Blueprint Configuration (render.yaml)
# https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: attendx-v2
    env: node
    region: singapore
    plan: free
    rootDir: attendx-v2
    buildCommand: cd attendx-v2 && npm install --include=dev && npm run build
    startCommand: cd attendx-v2 && npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: NEXT_PUBLIC_APP_URL
        sync: false
